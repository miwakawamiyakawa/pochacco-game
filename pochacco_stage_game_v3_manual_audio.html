<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8bd8ff">
<title>ポチャッコ おさんぽ大冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd8ff;touch-action:none;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.group{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.92);border-radius:18px;padding:8px 12px;box-shadow:0 5px 16px rgba(0,0,0,.12);font-weight:900;color:#2f5681}
.pill small{display:block;font-size:10px;letter-spacing:.7px;color:#5f84a8}
#topBtns{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 68px);display:flex;gap:9px;z-index:7}
.iconBtn{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(63,143,207,.88);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;touch-action:none}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:space-between;align-items:flex-end;z-index:8;pointer-events:none}
.ctrlGroup{display:flex;gap:14px}
.ctrl{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:rgba(116,82,54,.74);color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.2);touch-action:none}
#jumpBtn{width:88px;height:88px}
.ctrl.active{transform:scale(.93)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(84,177,231,.18);z-index:20;touch-action:none}
.card{width:min(92vw,450px);background:rgba(255,255,255,.96);padding:26px 22px;border-radius:30px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.22)}
.logo{font-size:34px;font-weight:1000;color:#826b92;letter-spacing:1px}
.sub{font-size:22px;font-weight:900;color:#5395c7}
.card p{line-height:1.65;color:#4e6275}
.start{width:100%;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:1000;background:#ffd867;color:#513c24;box-shadow:0 6px 0 #d9ac35;touch-action:none}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #d9ac35}
.hint{margin-top:12px;font-size:12px;color:#6f8295}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);background:rgba(36,53,67,.8);color:#fff;padding:9px 14px;border-radius:999px;font-weight:900;opacity:0;transition:.15s;z-index:12;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="group">
    <div class="pill"><small>BONES</small>🦴 <span id="bones">0</span></div>
    <div class="pill"><small>POSITION</small><span id="pos">0</span>m</div>
  </div>
  <div class="pill"><small>BEST BONES</small><span id="bestBones">0</span></div>
</div>

<div id="topBtns">
  <div class="iconBtn" id="musicBtn">🎵</div>
  <div class="iconBtn" id="soundBtn">🔊</div>
</div>

<div id="controls">
  <div class="ctrlGroup">
    <div class="ctrl" id="leftBtn">←</div>
    <div class="ctrl" id="rightBtn">→</div>
  </div>
  <div class="ctrl" id="jumpBtn">↑</div>
</div>

<div id="overlay">
  <div class="card">
    <div class="logo">POCHACCO</div>
    <div class="sub">おさんぽ大冒険</div>
    <p>強制スクロールなし。<br>← → で自由に移動して骨を集めよう！<br>↑をもう一度押すと<strong>二段ジャンプ</strong>。</p>
    <button class="start" id="startBtn">GO！</button>
    <div class="hint">スタートを押した瞬間にBGM・効果音を有効化します</div>
  </div>
</div>

<div id="toast"></div>

}

// ---------- Audio ----------
let audioCtx=null,musicOn=true,soundOn=true,musicTimer=null;
function unlockAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  g.gain.value=.00001;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.02);
}
function sfx(freq,dur=.1,type="square",vol=.05,delay=0){
  if(!audioCtx||!soundOn)return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03);
}
function jumpSound(second){
  sfx(second?720:520,.08,"square",.055);
  sfx(second?1040:790,.11,"sine",.035,.04);
}
function boneSound(){sfx(880,.06,"square",.045);sfx(1175,.10,"square",.035,.05)}
function hitSound(){sfx(150,.16,"sawtooth",.06);sfx(90,.2,"square",.04,.06)}

const musicNotes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33];
function scheduleMusic(){
  if(!audioCtx||!musicOn)return;
  const beat=.18,base=audioCtx.currentTime+.03;
  for(let i=0;i<musicNotes.length;i++){
    const t=base+i*beat;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="triangle";o.frequency.value=musicNotes[i];
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.028,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+beat*.72);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+beat*.75);
    if(i%4===0){
      const b=audioCtx.createOscillator(),bg=audioCtx.createGain();
      b.type="sine";b.frequency.value=musicNotes[i]/2;
      bg.gain.setValueAtTime(.018,t);bg.gain.exponentialRampToValueAtTime(.0001,t+beat*2.2);
      b.connect(bg);bg.connect(audioCtx.destination);b.start(t);b.stop(t+beat*2.25);
    }
  }
  clearTimeout(musicTimer);
  musicTimer=setTimeout(scheduleMusic,beat*musicNotes.length*1000-100);
}
function startMusic(){unlockAudio();clearTimeout(musicTimer);if(musicOn)scheduleMusic()}
function stopMusic(){clearTimeout(musicTimer);musicTimer=null}

document.getElementById("musicBtn").addEventListener("pointerup",function(e){
  e.preventDefault();unlockAudio();musicOn=!musicOn;this.textContent=musicOn?"🎵":"🚫";if(musicOn)startMusic();else stopMusic();
});
document.getElementById("soundBtn").addEventListener("pointerup",function(e){

// ---------- Input ----------
function setHold(el,key){
  const on=e=>{e.preventDefault();input[key]=true;el.classList.add("active");unlockAudio()};
  const off=e=>{if(e)e.preventDefault();input[key]=false;el.classList.remove("active")};
  el.addEventListener("pointerdown",on);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,off));
  el.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  el.addEventListener("touchend",e=>e.preventDefault(),{passive:false});
}
setHold(document.getElementById("leftBtn"),"left");
setHold(document.getElementById("rightBtn"),"right");

function doJump(){
  if(!running)return;
  unlockAudio();
  if(player.jumps<2){
    player.jumps++;
    player.vy=player.jumps===1?-625:-575;
    player.onGround=false;
    jumpSound(player.jumps===2);
    if(player.jumps===2)toastMsg("二段ジャンプ！");
  }
}
const jumpBtn=document.getElementById("jumpBtn");
jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();jumpBtn.classList.add("active");doJump()});
jumpBtn.addEventListener("pointerup",e=>{e.preventDefault();jumpBtn.classList.remove("active")});
jumpBtn.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
jumpBtn.addEventListener("touchend",e=>e.preventDefault(),{passive:false});

canvas.addEventListener("pointerdown",e=>{if(running){e.preventDefault();doJump()}});
canvas.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")input.left=true;
  if(e.key==="ArrowRight")input.right=true;
  if(e.key==="ArrowUp"||e.key===" "){e.preventDefault();doJump()}
});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")input.left=false;if(e.key==="ArrowRight")input.right=false});

function startGame(e){
  if(e)e.preventDefault();
  unlockAudio();
  reset();
  overlay.style.display="none";
  running=true;
  startMusic();
  last=performance.now();
  requestAnimationFrame(loop);
}
document.getElementById("startBtn").addEventListener("pointerup",startGame);

// ---------- Physics ----------
function rectHit(a,b,p=10){
  return a.x+p<b.x+b.w && a.x+a.w-p>b.x && a.y+p<b.y+b.h && a.y+a.h-p>b.y;
}
function itemHit(it){
  const cx=player.x+player.w/2,cy=player.y+player.h/2,dx=cx-it.x,dy=cy-it.y;
  return dx*dx+dy*dy<(it.r+27)*(it.r+27);
}
function update(dt){
  let dir=0;if(input.left)dir--;if(input.right)dir++;
  const accel=900,maxSpeed=260,friction=1000;
  if(dir!==0){
    player.dir=dir>0?1:-1;
    player.vx+=dir*accel*dt;
    player.vx=Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));
  }else{
    if(player.vx>0)player.vx=Math.max(0,player.vx-friction*dt);
    if(player.vx<0)player.vx=Math.min(0,player.vx+friction*dt);
  }
  player.x+=player.vx*dt;
  player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));

  player.vy+=1550*dt;player.y+=player.vy*dt;
  if(player.y>=groundY-player.h){player.y=groundY-player.h;player.vy=0;player.onGround=true;player.jumps=0}
  player.anim+=dt*(4+Math.abs(player.vx)/28);

  const target=player.x-W*.38;
  cameraX += (target-cameraX)*Math.min(1,dt*5);
  cameraX=Math.max(0,Math.min(WORLD_W-W,cameraX));
  posEl.textContent=Math.floor(player.x/10);

  for(let i=items.length-1;i>=0;i--){
    if(itemHit(items[i])){boneSound();bones++;bonesEl.textContent=bones;items.splice(i,1)}
  }
  for(const o of obstacles)if(rectHit(player,o,13))return gameOver();
  for(const en of enemies)if(rectHit(player,en,13))return gameOver();
}
function gameOver(){
  if(!running)return;
  running=false;stopMusic();hitSound();
  if(bones>bestBones){bestBones=bones;localStorage.setItem("pochacco_best_bones_v5",bestBones);bestBonesEl.textContent=bestBones}
  overlay.innerHTML=`<div class="card"><div class="logo">POCHACCO</div><div class="sub">おさんぽ終了！</div><p>集めた骨：<strong>${bones}</strong>個<br>現在位置：${Math.floor(player.x/10)}m</p><button class="start" id="retryBtn">もう一度！</button><div class="hint">強制スクロールなし。好きな方向へ戻れます。</div></div>`;
  overlay.style.display="flex";
  document.getElementById("retryBtn").addEventListener("pointerup",startGame);
}

// ---------- Drawing ----------
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function worldToScreen(x){return x-cameraX}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,groundY);g.addColorStop(0,"#8ad8ff");g.addColorStop(1,"#eaf9ff");ctx.fillStyle=g;ctx.fillRect(0,0,W,groundY);
  ctx.fillStyle="#fff";
  clouds.forEach(c=>{let x=(c.x-cameraX*.15)%WORLD_W;if(x<-100)x+=WORLD_W;ctx.globalAlpha=.86;ctx.beginPath();ctx.arc(x,c.y,c.s*.55,0,Math.PI*2);ctx.arc(x+c.s*.55,c.y-10,c.s*.45,0,Math.PI*2);ctx.arc(x+c.s,c.y,c.s*.5,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
  ctx.fillStyle="#86caef";ctx.fillRect(0,groundY-105,W,105);
  ctx.fillStyle="#b8dfd8";
  for(let x=-100-(cameraX*.08%220);x<W+150;x+=220){ctx.beginPath();ctx.arc(x,groundY-105,120,Math.PI,0);ctx.fill()}
  ctx.fillStyle="#69bc50";ctx.fillRect(0,groundY-10,W,14);
  ctx.fillStyle="#9fdb70";ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle="#987044";ctx.fillRect(0,groundY+28,W,H-groundY-28);
  for(let x=-(cameraX%90);x<W;x+=90){ctx.fillStyle="#75bf58";ctx.beginPath();ctx.arc(x,groundY+18,31,Math.PI,0);ctx.fill()}
}
function drawBone(it){
  const x=worldToScreen(it.x);if(x<-40||x>W+40)return;
  ctx.save();ctx.translate(x,it.y);ctx.rotate(Math.sin(player.anim+it.t)*.12);
  ctx.fillStyle="#ffd976";ctx.strokeStyle="#b77b28";ctx.lineWidth=3;rr(-14,-6,28,12,6);ctx.fill();ctx.stroke();
  for(const sx of [-1,1])for(const sy of [-1,1]){ctx.beginPath();ctx.arc(sx*13,sy*6,7,0,Math.PI*2);ctx.fill();ctx.stroke()}
  ctx.restore();
}
function drawObstacle(o){
  const x=worldToScreen(o.x);if(x<-80||x>W+80)return;
  ctx.fillStyle=o.type==="box"?"#c98d4a":"#7e8791";ctx.strokeStyle="#684a34";ctx.lineWidth=3;rr(x,o.y,o.w,o.h,7);ctx.fill();ctx.stroke();
  if(o.type==="box"){ctx.beginPath();ctx.moveTo(x+8,o.y+8);ctx.lineTo(x+o.w-8,o.y+o.h-8);ctx.moveTo(x+o.w-8,o.y+8);ctx.lineTo(x+8,o.y+o.h-8);ctx.stroke()}
}
function drawEnemy(e){
  const x=worldToScreen(e.x);if(x<-70||x>W+70)return;
  ctx.save();ctx.translate(x+e.w/2,e.y+e.h/2+Math.sin(player.anim+e.phase)*2);
  ctx.fillStyle="#ffd43c";ctx.strokeStyle="#443319";ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,3,17,20,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(6,-5,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f09a2f";ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(22,5);ctx.lineTo(13,9);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  const sx=worldToScreen(player.x);
  let img=runImg;
  if(!player.onGround)img=player.jumps>=2?jump2Img:jump1Img;
  const moving=Math.abs(player.vx)>15;
  let bob=0,rot=0,scaleY=1;
  if(player.onGround&&moving){
    bob=Math.sin(player.anim*2)*3;
    rot=Math.sin(player.anim)*.035;
    scaleY=1+Math.sin(player.anim*2)*.025;
  }else if(!player.onGround){
    rot=player.vy<0?-.05:.04;
  }
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.13)";ctx.beginPath();ctx.ellipse(sx+player.w/2,groundY+3,31,7,0,0,Math.PI*2);ctx.fill();
  ctx.translate(sx+player.w/2,player.y+player.h/2+bob);
  ctx.scale(player.dir,scaleY);
  ctx.rotate(rot);
  ctx.drawImage(img,-player.w/2,-player.h/2,player.w,player.h);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);drawBg();items.forEach(drawBone);obstacles.forEach(drawObstacle);enemies.forEach(drawEnemy);drawPlayer();
}
function loop(t){
  if(!running)return;
  const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();if(running)requestAnimationFrame(loop);
}
reset();draw();
})();
</script>
