<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8bd8ff">
<title>ポチャッコ おさんぽ大冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd8ff;touch-action:none;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.group{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.92);border-radius:18px;padding:8px 12px;box-shadow:0 5px 16px rgba(0,0,0,.12);font-weight:900;color:#2f5681}
.pill small{display:block;font-size:10px;letter-spacing:.7px;color:#5f84a8}
#topBtns{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 68px);display:flex;gap:9px;z-index:7}
.iconBtn{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(63,143,207,.88);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;touch-action:none}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:space-between;align-items:flex-end;z-index:8;pointer-events:none}
.ctrlGroup{display:flex;gap:14px}
.ctrl{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:rgba(116,82,54,.74);color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.2);touch-action:none}
#jumpBtn{width:88px;height:88px}
.ctrl.active{transform:scale(.93)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(84,177,231,.18);z-index:20;touch-action:none}
.card{width:min(92vw,450px);background:rgba(255,255,255,.96);padding:26px 22px;border-radius:30px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.22)}
.logo{font-size:34px;font-weight:1000;color:#826b92;letter-spacing:1px}
.sub{font-size:22px;font-weight:900;color:#5395c7}
.card p{line-height:1.65;color:#4e6275}
.start{width:100%;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:1000;background:#ffd867;color:#513c24;box-shadow:0 6px 0 #d9ac35;touch-action:none}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #d9ac35}
.hint{margin-top:12px;font-size:12px;color:#6f8295}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);background:rgba(36,53,67,.82);color:#fff;padding:9px 14px;border-radius:999px;font-weight:900;opacity:0;transition:.15s;z-index:12;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="group">
    <div class="pill"><small>BONES</small>🦴 <span id="bones">0</span></div>
    <div class="pill"><small>POSITION</small><span id="pos">0</span>m</div>
  </div>
  <div class="pill"><small>BEST BONES</small><span id="bestBones">0</span></div>
</div>

<div id="topBtns">
  <div class="iconBtn" id="musicBtn">🎵</div>
  <div class="iconBtn" id="soundBtn">🔊</div>
</div>

<div id="controls">
  <div class="ctrlGroup">
    <div class="ctrl" id="leftBtn">←</div>
    <div class="ctrl" id="rightBtn">→</div>
  </div>
  <div class="ctrl" id="jumpBtn">↑</div>
</div>

<div id="overlay">
  <div class="card">
    <div class="logo">POCHACCO</div>
    <div class="sub">おさんぽ大冒険</div>
    <p>← → で自由に移動。箱は<strong>踏み台</strong>にできます。<br>穴に落ちるとゲームオーバー！<br>↑をもう一度押すと<strong>二段ジャンプ</strong>。</p>
    <button class="start" id="startBtn">GO！</button>
    <div class="hint">BGMと効果音はGOを押した直後から再生します</div>
  </div>
</div>
<div id="toast"></div>

runImg.src=RUN_SRC;jump1Img.src=JUMP1_SRC;jump2Img.src=JUMP2_SRC;

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const bonesEl=document.getElementById("bones"),posEl=document.getElementById("pos"),bestBonesEl=document.getElementById("bestBones");
const toast=document.getElementById("toast");

const bgm=document.getElementById("bgm");
const jumpSfx=document.getElementById("jumpSfx");
const doubleSfx=document.getElementById("doubleSfx");
const boneSfx=document.getElementById("boneSfx");
const fallSfx=document.getElementById("fallSfx");
bgm.volume=.42;jumpSfx.volume=.7;doubleSfx.volume=.75;boneSfx.volume=.65;fallSfx.volume=.7;

let musicOn=true,soundOn=true;
let W=0,H=0,DPR=1,groundY=0;
const WORLD_W=3400;
let running=false,last=0,cameraX=0,bones=0;
let bestBones=Number(localStorage.getItem("pochacco_best_bones_v6")||0);
bestBonesEl.textContent=bestBones;

const player={x:180,y:0,w:82,h:86,vx:0,vy:0,onGround:true,jumps:0,dir:1,anim:0,coyote:0,jumpBuffer:0};
const input={left:false,right:false};
const items=[],blocks=[],clouds=[];
const pits=[
  {x:820,w:190},
  {x:1710,w:220},
  {x:2580,w:210}
];

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  groundY=H*.72;
  if(!running)player.y=groundY-player.h;
}
addEventListener("resize",resize);resize();

function reset(){
  bones=0;cameraX=0;
  player.x=180;player.y=groundY-player.h;player.vx=0;player.vy=0;player.onGround=true;player.jumps=0;player.dir=1;player.anim=0;player.coyote=.1;player.jumpBuffer=0;
  bonesEl.textContent="0";posEl.textContent="0";
  items.length=0;blocks.length=0;clouds.length=0;

  [330,510,700,1010,1190,1420,1610,2040,2240,2430,2940,3170].forEach((x,i)=>items.push({x,y:groundY-105-(i%3)*52,r:16,t:i}));
  [
    {x:610,y:groundY-55,w:62,h:55},
    {x:1180,y:groundY-78,w:74,h:78},
    {x:1470,y:groundY-55,w:62,h:55},
    {x:2150,y:groundY-95,w:86,h:95},
    {x:2390,y:groundY-58,w:65,h:58},
    {x:3060,y:groundY-75,w:76,h:75}
  ].forEach(b=>blocks.push(b));

  for(let i=0;i<10;i++)clouds.push({x:i*380+80,y:70+(i%4)*42,s:30+(i%3)*10});
}

function toastMsg(s){
  toast.textContent=s;toast.style.opacity=1;
  clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.style.opacity=0,450);
}

// iPhone zoom/gesture suppression.
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});

function safePlay(a, restart=true){
  if(restart){try{a.currentTime=0}catch(_e){}}
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{});
}
function playSfx(a){if(soundOn)safePlay(a,true)}
function startBgm(){if(musicOn)safePlay(bgm,false)}
function stopBgm(){bgm.pause()}

document.getElementById("musicBtn").addEventListener("pointerup",function(e){
  e.preventDefault();musicOn=!musicOn;this.textContent=musicOn?"🎵":"🚫";if(musicOn)startBgm();else stopBgm();
});
document.getElementById("soundBtn").addEventListener("pointerup",function(e){
  e.preventDefault();soundOn=!soundOn;this.textContent=soundOn?"🔊":"🔇";
});

function holdButton(id,key){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();input[key]=true;el.classList.add("active");
    try{el.setPointerCapture(e.pointerId)}catch(_e){}
  });
  const off=e=>{e.preventDefault();input[key]=false;el.classList.remove("active")};
  el.addEventListener("pointerup",off);el.addEventListener("pointercancel",off);el.addEventListener("lostpointercapture",off);
}
holdButton("leftBtn","left");holdButton("rightBtn","right");

function queueJump(){
  if(!running)return;
  player.jumpBuffer=.12;
}
const jumpBtn=document.getElementById("jumpBtn");
jumpBtn.addEventListener("pointerdown",e=>{
  e.preventDefault();jumpBtn.classList.add("active");queueJump();
  try{jumpBtn.setPointerCapture(e.pointerId)}catch(_e){}
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>jumpBtn.addEventListener(ev,e=>{e.preventDefault();jumpBtn.classList.remove("active")}));

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")input.left=true;
  if(e.key==="ArrowRight")input.right=true;
  if(e.key==="ArrowUp"||e.key===" "){e.preventDefault();queueJump()}
});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")input.left=false;if(e.key==="ArrowRight")input.right=false});

function startGame(e){
  if(e)e.preventDefault();
  if(running)return;
  reset();
  // Directly triggered by GO user gesture; start actual <audio> media here.
  if(musicOn){try{bgm.currentTime=0}catch(_e){}safePlay(bgm,false)}
  if(soundOn){safePlay(jumpSfx,true);setTimeout(()=>jumpSfx.pause(),40)}
  overlay.style.display="none";
  running=true;last=performance.now();requestAnimationFrame(loop);
}
document.getElementById("startBtn").addEventListener("pointerup",startGame);

function inPit(x){
  const center=x+player.w*.5;
  return pits.some(p=>center>p.x && center<p.x+p.w);
}
function approach(v,target,maxDelta){
  if(v<target)return Math.min(v+maxDelta,target);
  if(v>target)return Math.max(v-maxDelta,target);
  return target;
}
function rectOverlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function itemHit(it){
  const cx=player.x+player.w/2,cy=player.y+player.h/2,dx=cx-it.x,dy=cy-it.y;
  return dx*dx+dy*dy<(it.r+27)*(it.r+27);
}

function resolveBlockCollisions(prevX,prevY){
  player.onGround=false;
  for(const b of blocks){
    if(!rectOverlap(player,b))continue;

    const prevBottom=prevY+player.h, nowBottom=player.y+player.h;
    const prevTop=prevY, nowTop=player.y;
    const prevRight=prevX+player.w, prevLeft=prevX;

    // Landing on top = platform.
    if(player.vy>=0 && prevBottom<=b.y+8 && nowBottom>=b.y){
      player.y=b.y-player.h;
      player.vy=0;
      player.onGround=true;
      player.jumps=0;
      continue;
    }

    // Hitting underside.
    if(player.vy<0 && prevTop>=b.y+b.h-8 && nowTop<=b.y+b.h){
      player.y=b.y+b.h;
      player.vy=0;
      continue;
    }

    // Side collision: stop against block, never game-over.
    if(prevRight<=b.x+8 && player.x+player.w>b.x){
      player.x=b.x-player.w;player.vx=0;
    }else if(prevLeft>=b.x+b.w-8 && player.x<b.x+b.w){
      player.x=b.x+b.w;player.vx=0;
    }
  }
}

function update(dt){
  const prevX=player.x,prevY=player.y;

  // Responsive controls: very fast acceleration, even faster braking.
  let dir=0;if(input.left)dir--;if(input.right)dir++;
  const maxSpeed=255;
  if(dir!==0){
    player.dir=dir>0?1:-1;
    player.vx=approach(player.vx,dir*maxSpeed,2600*dt);
  }else{
    player.vx=approach(player.vx,0,4200*dt);
  }

  player.x+=player.vx*dt;
  player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));

  if(player.onGround)player.coyote=.10;else player.coyote=Math.max(0,player.coyote-dt);
  player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);

  // Buffered jump + coyote time + double jump.
  if(player.jumpBuffer>0){
    if(player.onGround || player.coyote>0){
      player.vy=-625;player.onGround=false;player.coyote=0;player.jumps=1;player.jumpBuffer=0;playSfx(jumpSfx);
    }else if(player.jumps<2){
      player.vy=-575;player.jumps=2;player.jumpBuffer=0;playSfx(doubleSfx);toastMsg("二段ジャンプ！");
    }
  }

  player.vy+=1550*dt;player.y+=player.vy*dt;

  resolveBlockCollisions(prevX,prevY);

  // Ground exists except over pits.
  if(!player.onGround && player.vy>=0 && player.y+player.h>=groundY && !inPit(player.x)){
    player.y=groundY-player.h;player.vy=0;player.onGround=true;player.jumps=0;
  }

  if(player.y>H+120) return gameOver();

  player.anim+=dt*(4+Math.abs(player.vx)/28);
  const target=player.x-W*.38;
  cameraX+=(target-cameraX)*Math.min(1,dt*7);
  cameraX=Math.max(0,Math.min(WORLD_W-W,cameraX));
  posEl.textContent=Math.floor(player.x/10);

  for(let i=items.length-1;i>=0;i--){
    if(itemHit(items[i])){playSfx(boneSfx);bones++;bonesEl.textContent=bones;items.splice(i,1)}
  }
}

function gameOver(){
  if(!running)return;
  running=false;stopBgm();playSfx(fallSfx);
  if(bones>bestBones){bestBones=bones;localStorage.setItem("pochacco_best_bones_v6",bestBones);bestBonesEl.textContent=bestBones}
  overlay.innerHTML=`<div class="card"><div class="logo">POCHACCO</div><div class="sub">穴に落ちちゃった！</div><p>集めた骨：<strong>${bones}</strong>個<br>現在位置：${Math.floor(player.x/10)}m</p><button class="start" id="retryBtn">もう一度！</button><div class="hint">箱は踏み台。穴だけがゲームオーバーです。</div></div>`;
  overlay.style.display="flex";
  document.getElementById("retryBtn").addEventListener("pointerup",startGame);
}

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function sx(x){return x-cameraX}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,"#7fd4ff");sky.addColorStop(.62,"#dff6ff");sky.addColorStop(1,"#f7fcff");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // soft sun
  ctx.fillStyle="rgba(255,236,126,.85)";ctx.beginPath();ctx.arc(W-95,92,34,0,Math.PI*2);ctx.fill();

  // layered fluffy clouds
  clouds.forEach((c,i)=>{
    let x=((c.x-cameraX*.11)%WORLD_W+WORLD_W)%WORLD_W;
    if(x>W+180)x-=WORLD_W;
    ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.beginPath();
    ctx.arc(x,c.y,c.s*.55,0,Math.PI*2);
    ctx.arc(x+c.s*.48,c.y-11,c.s*.48,0,Math.PI*2);
    ctx.arc(x+c.s*.95,c.y,c.s*.56,0,Math.PI*2);
    ctx.fill();
  });

  // distant islands
  const par=cameraX*.18;
  ctx.fillStyle="#a7d9c8";
  for(let x=-180-(par%300);x<W+250;x+=300){
    ctx.beginPath();ctx.arc(x,groundY-145,145,Math.PI,0);ctx.fill();
  }
  ctx.fillStyle="#78bd9c";
  for(let x=-120-(par%230);x<W+220;x+=230){
    ctx.beginPath();ctx.arc(x,groundY-118,105,Math.PI,0);ctx.fill();
  }

  // lighthouse island
  let lx=1500-cameraX*.24;
  if(lx>-100&&lx<W+120){
    ctx.fillStyle="#6ca28f";ctx.beginPath();ctx.ellipse(lx,groundY-100,135,28,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.fillRect(lx-10,groundY-178,22,72);
    ctx.fillStyle="#e9785f";ctx.beginPath();ctx.moveTo(lx-18,groundY-178);ctx.lineTo(lx+23,groundY-178);ctx.lineTo(lx+3,groundY-201);ctx.closePath();ctx.fill();
    ctx.fillStyle="#6aa0bd";ctx.fillRect(lx-5,groundY-154,10,16);
  }

  // sea
  ctx.fillStyle="#63bce9";ctx.fillRect(0,groundY-100,W,100);
  ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=2;
  for(let y=groundY-82;y<groundY-8;y+=18){
    ctx.beginPath();
    for(let x=-30-(cameraX*.06%80);x<W+40;x+=80){ctx.moveTo(x,y);ctx.quadraticCurveTo(x+20,y-7,x+40,y);ctx.quadraticCurveTo(x+60,y+7,x+80,y)}
    ctx.stroke();
  }

  // sailboat
  let bx=620-cameraX*.16;
  if(bx>-80&&bx<W+80){
    ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(bx,groundY-135);ctx.lineTo(bx+22,groundY-100);ctx.lineTo(bx,groundY-100);ctx.closePath();ctx.fill();
    ctx.fillStyle="#ef7d68";ctx.beginPath();ctx.moveTo(bx,groundY-135);ctx.lineTo(bx-18,groundY-103);ctx.lineTo(bx,groundY-103);ctx.closePath();ctx.fill();
    ctx.fillStyle="#845b40";ctx.fillRect(bx-18,groundY-98,42,5);
  }

  // foreground trees repeated
  for(let wx=120;wx<WORLD_W;wx+=760){
    const x=sx(wx);
    if(x<-180||x>W+180)continue;
    ctx.fillStyle="#8b6a4d";ctx.fillRect(x-18,groundY-205,36,195);
    ctx.fillStyle="#5fae72";
    [[-58,-205,62],[-8,-238,72],[55,-207,58]].forEach(p=>{ctx.beginPath();ctx.arc(x+p[0],groundY+p[1],p[2],0,Math.PI*2);ctx.fill()});
    ctx.fillStyle="#77c983";
    [[-78,-220,35],[22,-262,40],[83,-225,32]].forEach(p=>{ctx.beginPath();ctx.arc(x+p[0],groundY+p[1],p[2],0,Math.PI*2);ctx.fill()});
  }

  // ground segments + pits
  const segments=[];
  let start=0;
  pits.forEach(p=>{segments.push({x:start,w:p.x-start});start=p.x+p.w});
  segments.push({x:start,w:WORLD_W-start});
  segments.forEach(seg=>{
    const x=sx(seg.x),w=seg.w;
    if(x+w<0||x>W)return;
    ctx.fillStyle="#67bd4d";ctx.fillRect(x,groundY-10,w,14);
    ctx.fillStyle="#9bdc70";ctx.fillRect(x,groundY,w,28);
    ctx.fillStyle="#9a7047";ctx.fillRect(x,groundY+28,w,H-groundY);
    ctx.fillStyle="#78c55a";
    for(let gx=x-(x%58);gx<x+w;gx+=58){ctx.beginPath();ctx.arc(gx,groundY+18,30,Math.PI,0);ctx.fill()}
    // little soil dots
    ctx.fillStyle="rgba(105,74,43,.2)";
    for(let gx=Math.max(x,0)+22;gx<Math.min(x+w,W);gx+=78){ctx.beginPath();ctx.arc(gx,groundY+65+(gx%3)*18,4,0,Math.PI*2);ctx.fill()}
  });

  // water in pits and foam
  pits.forEach(p=>{
    const x=sx(p.x);if(x+p.w<0||x>W)return;
    ctx.fillStyle="#53b8eb";ctx.fillRect(x,groundY-3,p.w,H-groundY+3);
    ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();
    for(let q=x;q<x+p.w;q+=34)ctx.quadraticCurveTo(q+9,groundY-12,q+17,groundY-5),ctx.quadraticCurveTo(q+25,groundY+2,q+34,groundY-5);
    ctx.stroke();
  });

  // flowers + fence details
  for(let wx=80;wx<WORLD_W;wx+=150){
    if(pits.some(p=>wx>p.x&&wx<p.x+p.w))continue;
    const x=sx(wx);if(x<-20||x>W+20)continue;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,groundY-22,5,0,Math.PI*2);ctx.arc(x+8,groundY-20,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ffd75b";ctx.beginPath();ctx.arc(x+4,groundY-21,3,0,Math.PI*2);ctx.fill();
  }
}

function drawBone(it){
  const x=sx(it.x);if(x<-40||x>W+40)return;
  ctx.save();ctx.translate(x,it.y);ctx.rotate(Math.sin(player.anim+it.t)*.12);
  ctx.fillStyle="#ffd976";ctx.strokeStyle="#b77b28";ctx.lineWidth=3;rr(-14,-6,28,12,6);ctx.fill();ctx.stroke();
  for(const a of [-1,1])for(const b of [-1,1]){ctx.beginPath();ctx.arc(a*13,b*6,7,0,Math.PI*2);ctx.fill();ctx.stroke()}
  ctx.restore();
}

function drawBlock(b){
  const x=sx(b.x);if(x+b.w<-50||x>W+50)return;
  ctx.fillStyle="#c98d4a";ctx.strokeStyle="#84582e";ctx.lineWidth=3;rr(x,b.y,b.w,b.h,6);ctx.fill();ctx.stroke();
  ctx.strokeStyle="#986535";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+9,b.y+9);ctx.lineTo(x+b.w-9,b.y+b.h-9);ctx.moveTo(x+b.w-9,b.y+9);ctx.lineTo(x+9,b.y+b.h-9);ctx.stroke();
  ctx.strokeStyle="#e2ae70";ctx.lineWidth=2;ctx.strokeRect(x+7,b.y+7,b.w-14,b.h-14);
}

function drawPlayer(){
  // Character graphics and sprite choices intentionally unchanged.
  const x=sx(player.x);
  let img=runImg;
  if(!player.onGround)img=player.jumps>=2?jump2Img:jump1Img;
  const moving=Math.abs(player.vx)>15;
  let bob=0,rot=0,scaleY=1;
  if(player.onGround&&moving){
    bob=Math.sin(player.anim*2)*3;
    rot=Math.sin(player.anim)*.035;
    scaleY=1+Math.sin(player.anim*2)*.025;
  }else if(!player.onGround){
    rot=player.vy<0?-.05:.04;
  }
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.13)";ctx.beginPath();ctx.ellipse(x+player.w/2,groundY+3,31,7,0,0,Math.PI*2);ctx.fill();
  ctx.translate(x+player.w/2,player.y+player.h/2+bob);
  ctx.scale(player.dir,scaleY);
  ctx.rotate(rot);
  ctx.drawImage(img,-player.w/2,-player.h/2,player.w,player.h);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  items.forEach(drawBone);
  blocks.forEach(drawBlock);
  drawPlayer();
}

function loop(t){
  if(!running)return;
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  update(dt);draw();
  if(running)requestAnimationFrame(loop);
}

reset();draw();
})();
</script>
</body>
</html>
