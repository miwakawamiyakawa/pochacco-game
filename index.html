<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#76d2ff">
<title>ポチャッコ おさんぽ大冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78d2ff;touch-action:none;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;z-index:6;pointer-events:none}
.hgroup{display:flex;gap:8px}
.pill{background:rgba(255,255,255,.92);border:2px solid rgba(255,255,255,.9);border-radius:18px;padding:8px 12px;box-shadow:0 5px 16px rgba(0,0,0,.13);font-weight:900;color:#31577c}
.pill small{display:block;font-size:10px;letter-spacing:.8px;color:#6388a8}
#top{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 68px);display:flex;gap:9px;z-index:8}
.icon{width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:rgba(53,139,208,.88);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 5px 14px rgba(0,0,0,.16)}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:space-between;align-items:flex-end;z-index:8;pointer-events:none}
.cg{display:flex;gap:14px}
.ctrl{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:rgba(105,75,51,.69);backdrop-filter:blur(3px);color:#fff;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.20);touch-action:none}
#jumpBtn{width:88px;height:88px}
.ctrl.active{transform:scale(.93)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(69,165,226,.15);z-index:20}
.card{width:min(92vw,455px);background:rgba(255,255,255,.96);padding:26px 22px;border-radius:30px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.22)}
.logo{font-size:36px;font-weight:1000;color:#806890;letter-spacing:1px}
.sub{font-size:22px;font-weight:900;color:#4d95c9}
.card p{line-height:1.65;color:#4d6174}
.start{width:100%;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:1000;background:#ffd867;color:#523b23;box-shadow:0 6px 0 #d9ad35;touch-action:none}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #d9ad35}
.hint{margin-top:12px;font-size:12px;color:#718497}
#comboFX{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.7);z-index:12;pointer-events:none;text-align:center;opacity:0;filter:drop-shadow(0 6px 0 rgba(255,255,255,.8))}
#comboFX.show{animation:comboPop .75s cubic-bezier(.2,.9,.2,1)}
#comboNum{font-size:64px;font-weight:1000;line-height:.8;color:#ff5b7f;-webkit-text-stroke:4px #fff;text-shadow:0 5px 0 #f4c948,0 9px 18px rgba(0,0,0,.18)}
#comboText{font-size:28px;font-weight:1000;color:#ff4f78;-webkit-text-stroke:2px #fff;text-shadow:0 3px 0 #f5c63d}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}55%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.05)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 118px);transform:translateX(-50%);background:rgba(34,51,66,.84);color:#fff;padding:9px 14px;border-radius:999px;font-weight:900;opacity:0;transition:.14s;z-index:12;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="hgroup">
  <div class="pill"><small>BANANA ICE</small>🍌🍦 <span id="iceCount">0</span></div>
  <div class="pill"><small>SCORE</small><span id="score">000000</span></div>
 </div>
 <div class="pill"><small>BEST</small><span id="best">000000</span></div>
</div>
<div id="top"><div class="icon" id="musicBtn">🎵</div><div class="icon" id="soundBtn">🔊</div></div>
<div id="controls"><div class="cg"><div class="ctrl" id="left">←</div><div class="ctrl" id="right">→</div></div><div class="ctrl" id="jumpBtn">↑</div></div>
<div id="comboFX"><div id="comboNum">1</div><div id="comboText">COMBO!</div></div>
<div id="toast"></div>
<div id="overlay">

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;

 groundY=H*.72;if(!running)player.y=groundY-player.h;
}

function hash(n){let x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
function generateChunk(ci){
 const base=ci*720;if(ci===0){generatedTo=720;return}
 const r1=hash(ci),r2=hash(ci+17);
 const pitX=base+390+Math.floor(r1*75),pitW=125+Math.floor(r2*60);pits.push({x:pitX,w:pitW});
 crates.push({x:base+220,y:groundY-58,w:66,h:58});
 if(hash(ci+29)>.45)crates.push({x:base+590,y:groundY-80,w:74,h:80});
 if(hash(ci+43)>.55)floaters.push({x:base+500,y:groundY-175,w:126,h:27});
 for(let k=0;k<7;k++){
   const x=base+105+k*78;if(x>pitX-22&&x<pitX+pitW+22)continue;
   ices.push({x,y:groundY-100-(k%3)*45,r:18,gold:false,t:k+ci});
 }
 if(ci%3===0)ices.push({x:pitX+pitW/2,y:groundY-190,r:22,gold:true,t:ci});
 generatedTo=base+720;
}
function ensureWorld(){
 while(generatedTo<cameraX+W+1500)generateChunk(Math.floor(generatedTo/720)+1);
 while(nextFriendAt<cameraX+W+1300){
   const name=friendNames[friendSerial%friendNames.length];
   friendPickups.push({x:nextFriendAt,y:groundY-60,w:48,h:54,name,bob:friendSerial});
   friendSerial++;nextFriendAt+=900+Math.floor(hash(friendSerial+71)*650);
 }
}
function reset(){
 running=false;cameraX=0;scrollSpeed=185;iceCount=0;score=0;combo=0;comboTimer=0;generatedTo=0;nextFriendAt=1000;friendSerial=0;
 player.screenX=Math.max(115,W*.18);player.y=groundY-player.h;player.vx=0;player.vy=0;player.onGround=true;player.jumps=0;player.anim=0;player.coyote=.1;player.jumpBuffer=0;
 iceEl.textContent="0";scoreEl.textContent="000000";ices.length=0;crates.length=0;pits.length=0;floaters.length=0;friendPickups.length=0;followers.length=0;clouds.length=0;
 for(let i=0;i<14;i++)clouds.push({x:i*330+50,y:55+(i%4)*44,s:30+(i%3)*10});
 generateChunk(0);ensureWorld();
}
function safePlay(a,restart=true){if(restart)try{a.currentTime=0}catch(_e){};let p=a.play();if(p&&p.catch)p.catch(()=>{})}

function hold(id,key){

 const off=e=>{e.preventDefault();input[key]=false;el.classList.remove("active")};["pointerup","pointercancel","lostpointercapture"].forEach(ev=>el.addEventListener(ev,off));
}hold("left","left");hold("right","right");

function approach(v,t,d){return v<t?Math.min(v+d,t):v>t?Math.max(v-d,t):t}
function inPit(x){return pits.some(p=>x>p.x&&x<p.x+p.w)}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function rectWorld(){return {x:cameraX+player.screenX,y:player.y,w:player.w,h:player.h}}
function resolvePlatforms(prevWX,prevY){
 player.onGround=false;let pr=rectWorld();
 for(const b of crates){
   if(!overlap(pr,b))continue;
   if(player.vy>=0&&prevY+player.h<=b.y+8&&player.y+player.h>=b.y){player.y=b.y-player.h;player.vy=0;player.onGround=true;player.jumps=0;pr=rectWorld();continue}
   if(player.vy<0&&prevY>=b.y+b.h-8){player.y=b.y+b.h;player.vy=0;pr=rectWorld();continue}
   if(prevWX+player.w<=b.x+8){player.screenX=b.x-cameraX-player.w;player.vx=0;pr=rectWorld()}
   else if(prevWX>=b.x+b.w-8){player.screenX=b.x+b.w-cameraX;player.vx=0;pr=rectWorld()}
 }
 for(const f of floaters){
   pr=rectWorld();if(pr.x+pr.w<f.x||pr.x>f.x+f.w)continue;
   if(player.vy>=0&&prevY+player.h<=f.y+8&&player.y+player.h>=f.y){player.y=f.y-player.h;player.vy=0;player.onGround=true;player.jumps=0;break}
 }
}
function collectThings(){
 const pr=rectWorld(),cx=pr.x+pr.w/2,cy=pr.y+pr.h/2;
 for(let i=ices.length-1;i>=0;i--){
   const it=ices[i],dx=cx-it.x,dy=cy-it.y;if(dx*dx+dy*dy<(it.r+30)*(it.r+30)){
     ices.splice(i,1);iceCount++;combo=Math.min(99,combo+1);comboTimer=2.15;let gain=(it.gold?500:100)*Math.max(1,combo);score+=gain;iceEl.textContent=iceCount;scoreEl.textContent=String(Math.floor(score)).padStart(6,"0");sfx(iceSfx);showCombo();
   }
 }
 for(let i=friendPickups.length-1;i>=0;i--){
   const f=friendPickups[i];if(overlap(pr,{x:f.x,y:f.y,w:f.w,h:f.h})){
     friendPickups.splice(i,1);followers.push({x:player.screenX-(followers.length+1)*44,y:player.y+24,name:f.name,phase:followers.length});score+=1000;scoreEl.textContent=String(Math.floor(score)).padStart(6,"0");sfx(friendSfx);msg(f.name+" が仲間になった！");
   }
 }
}
function update(dt){
 ensureWorld();scrollSpeed=Math.min(320,185+cameraX/5500*48);cameraX+=scrollSpeed*dt;
 const prevWX=cameraX+player.screenX,prevY=player.y;let dir=0;if(input.left)dir--;if(input.right)dir++;
 if(dir!==0)player.vx=approach(player.vx,dir*235,2700*dt);else player.vx=approach(player.vx,0,4100*dt);
 player.screenX+=player.vx*dt;player.screenX=Math.max(30,Math.min(W*.72,player.screenX));
 if(player.onGround)player.coyote=.1;else player.coyote=Math.max(0,player.coyote-dt);player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
 if(player.jumpBuffer>0){
   if(player.onGround||player.coyote>0){player.vy=-625;player.onGround=false;player.coyote=0;player.jumps=1;player.jumpBuffer=0;sfx(jumpSfx)}
   else if(player.jumps<2){player.vy=-575;player.jumps=2;player.jumpBuffer=0;sfx(doubleSfx)}
 }
 player.vy+=1550*dt;player.y+=player.vy*dt;resolvePlatforms(prevWX,prevY);
 const wc=cameraX+player.screenX+player.w/2;
 if(!player.onGround&&player.vy>=0&&player.y+player.h>=groundY&&!inPit(wc)){player.y=groundY-player.h;player.vy=0;player.onGround=true;player.jumps=0}
 if(player.y>H+110)return gameOver();
 comboTimer=Math.max(0,comboTimer-dt);if(comboTimer<=0)combo=0;
 player.anim+=dt*(7+scrollSpeed/35);score+=dt*8;scoreEl.textContent=String(Math.floor(score)).padStart(6,"0");collectThings();
 followers.forEach((f,i)=>{let row=Math.floor(i/5),slot=i%5,tx=player.screenX-55-slot*38,ty=player.y+36-row*38;f.x+=(tx-f.x)*Math.min(1,dt*7);f.y+=(ty-f.y)*Math.min(1,dt*7)})
}
function startGame(e){if(e)e.preventDefault();if(running)return;reset();try{bgm.currentTime=0}catch(_e){};if(musicOn)startBgm();overlay.style.display="none";running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById("startBtn").onclick=startGame;
function gameOver(){
 if(!running)return;running=false;stopBgm();sfx(fallSfx);if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem("pochacco_best_final",best);bestEl.textContent=String(best).padStart(6,"0")}
 overlay.innerHTML=`<div class="card"><div class="logo">POCHACCO</div><div class="sub">穴に落ちちゃった！</div><p>バナナアイス：<strong>${iceCount}</strong>個<br>仲間：<strong>${followers.length}</strong>人<br>SCORE：${String(Math.floor(score)).padStart(6,"0")}</p><button class="start" id="retry">もう一度！</button></div>`;overlay.style.display="flex";document.getElementById("retry").onclick=startGame;
}

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function sx(x){return x-cameraX}
function drawBG(){
 let sky=ctx.createLinearGradient(0,0,0,groundY);sky.addColorStop(0,"#73ceff");sky.addColorStop(.55,"#dff6ff");sky.addColorStop(1,"#f8fcff");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 clouds.forEach((c,i)=>{let x=((c.x-cameraX*.09)%4600+4600)%4600;if(x>W+170)x-=4600;ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(x,c.y,c.s*.65,0,Math.PI*2);ctx.arc(x+c.s*.55,c.y-12,c.s*.52,0,Math.PI*2);ctx.arc(x+c.s*1.1,c.y,c.s*.6,0,Math.PI*2);ctx.fill()});
 ctx.fillStyle="#b7e0ca";for(let x=-180-(cameraX*.14%300);x<W+220;x+=300){ctx.beginPath();ctx.arc(x,groundY-154,145,Math.PI,0);ctx.fill()}
 ctx.fillStyle="#7cbf9d";for(let x=-120-(cameraX*.18%230);x<W+220;x+=230){ctx.beginPath();ctx.arc(x,groundY-120,105,Math.PI,0);ctx.fill()}
 ctx.fillStyle="#62bce9";ctx.fillRect(0,groundY-107,W,107);ctx.strokeStyle="rgba(255,255,255,.65)";ctx.lineWidth=2;
 for(let y=groundY-86;y<groundY-8;y+=19){ctx.beginPath();for(let x=-40-(cameraX*.05%80);x<W+80;x+=80){ctx.moveTo(x,y);ctx.quadraticCurveTo(x+20,y-7,x+40,y);ctx.quadraticCurveTo(x+60,y+7,x+80,y)}ctx.stroke()}
 for(let wx=80;wx<30000;wx+=820){let x=sx(wx);if(x<-220||x>W+220)continue;ctx.fillStyle="#8b6749";ctx.fillRect(x-18,groundY-214,36,205);ctx.fillStyle="#5cab70";[[-65,-210,67],[-10,-250,80],[60,-210,64]].forEach(p=>{ctx.beginPath();ctx.arc(x+p[0],groundY+p[1],p[2],0,Math.PI*2);ctx.fill()});ctx.fillStyle="#76ca82";[[-82,-228,35],[30,-276,42],[90,-228,34]].forEach(p=>{ctx.beginPath();ctx.arc(x+p[0],groundY+p[1],p[2],0,Math.PI*2);ctx.fill()})}
 const L=cameraX-80,R=cameraX+W+80,step=16;
 for(let wx=L;wx<R;wx+=step){if(pits.some(p=>wx+step>p.x&&wx<p.x+p.w))continue;let x=sx(wx);ctx.fillStyle="#67bd4d";ctx.fillRect(x,groundY-10,step+1,14);ctx.fillStyle="#9bdd70";ctx.fillRect(x,groundY,step+1,28);ctx.fillStyle="#9a7047";ctx.fillRect(x,groundY+28,step+1,H-groundY)}
 for(let x=-20-(cameraX%58);x<W+30;x+=58){ctx.fillStyle="#77c459";ctx.beginPath();ctx.arc(x,groundY+18,30,Math.PI,0);ctx.fill()}
 ctx.fillStyle="rgba(112,78,42,.18)";for(let x=25-(cameraX%90);x<W;x+=90){ctx.beginPath();ctx.arc(x,groundY+68+(x%3)*16,4,0,Math.PI*2);ctx.fill()}
 pits.forEach(p=>{let x=sx(p.x);if(x+p.w<0||x>W)return;ctx.fillStyle="#51b8eb";ctx.fillRect(x,groundY-4,p.w,H-groundY+5);ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();for(let q=x;q<x+p.w;q+=34){ctx.moveTo(q,groundY-4);ctx.quadraticCurveTo(q+9,groundY-12,q+17,groundY-5);ctx.quadraticCurveTo(q+25,groundY+2,q+34,groundY-5)}ctx.stroke()});
 for(let wx=Math.floor((cameraX-100)/125)*125;wx<cameraX+W+100;wx+=125){if(pits.some(p=>wx>p.x&&wx<p.x+p.w))continue;let x=sx(wx);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,groundY-22,5,0,Math.PI*2);ctx.arc(x+8,groundY-20,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd55a";ctx.beginPath();ctx.arc(x+4,groundY-21,3,0,Math.PI*2);ctx.fill()}
}
function drawIce(it){let x=sx(it.x);if(x<-50||x>W+50)return;ctx.save();ctx.translate(x,it.y);ctx.rotate(Math.sin(player.anim+it.t)*.08);if(it.gold){ctx.shadowColor="#fff29a";ctx.shadowBlur=18}ctx.fillStyle="#d49a56";ctx.strokeStyle="#9e6935";ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-9,7);ctx.lineTo(10,7);ctx.lineTo(1,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=it.gold?"#ffec71":"#f6d94e";ctx.strokeStyle="#ad8c2d";ctx.beginPath();ctx.arc(0,3,12,0,Math.PI*2);ctx.arc(-5,-5,9,0,Math.PI*2);ctx.arc(4,-10,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
function drawCrate(b){let x=sx(b.x);if(x+b.w<-60||x>W+60)return;ctx.fillStyle="#c78b49";ctx.strokeStyle="#81562f";ctx.lineWidth=3;rr(x,b.y,b.w,b.h,6);ctx.fill();ctx.stroke();ctx.strokeStyle="#986438";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+9,b.y+9);ctx.lineTo(x+b.w-9,b.y+b.h-9);ctx.moveTo(x+b.w-9,b.y+9);ctx.lineTo(x+9,b.y+b.h-9);ctx.stroke();ctx.strokeStyle="#e2ad70";ctx.lineWidth=2;ctx.strokeRect(x+7,b.y+7,b.w-14,b.h-14)}
function drawFloater(f){let x=sx(f.x);if(x+f.w<0||x>W)return;ctx.fillStyle="#65bb4b";rr(x,f.y,f.w,f.h,9);ctx.fill();ctx.fillStyle="#9a7047";rr(x,f.y+10,f.w,f.h+10,8);ctx.fill();ctx.fillStyle="#91d66b";ctx.fillRect(x,f.y,f.w,12)}
function drawFriends(){
 friendPickups.forEach(f=>{let x=sx(f.x);if(x<-70||x>W+70)return;let im=friendImgs[f.name];ctx.drawImage(im,x-2,f.y-4,56,62)});
 followers.forEach((f,i)=>{let im=friendImgs[f.name];ctx.drawImage(im,f.x,f.y,48,54)});
}
function drawPlayer(){
 const frames=player.onGround?["run1","run2","run3"]:player.jumps>=2?["jump2","jump3"]:["jump1","jump2"];
 let idx=player.onGround?Math.floor(player.anim)%frames.length:(player.vy<0?0:frames.length-1),im=pochImgs[frames[idx]];
 let bob=player.onGround?Math.sin(player.anim*2)*2.5:0;ctx.save();ctx.fillStyle="rgba(0,0,0,.12)";ctx.beginPath();ctx.ellipse(player.screenX+player.w/2,groundY+3,31,7,0,0,Math.PI*2);ctx.fill();ctx.drawImage(im,player.screenX,player.y+bob,player.w,player.h);ctx.restore()
}
function draw(){ctx.clearRect(0,0,W,H);drawBG();floaters.forEach(drawFloater);ices.forEach(drawIce);crates.forEach(drawCrate);drawFriends();drawPlayer()}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
reset();draw();
})();
</script>
