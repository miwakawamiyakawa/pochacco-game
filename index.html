<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9edcff">
<title>POCHACCO 3D おさんぽタウン</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9edcff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
  .pill{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:9px 13px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-weight:900;color:#36566f}
  .pill b{color:#f5a900}
  #hint{position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);z-index:11;background:rgba(255,255,255,.88);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;color:#537084;opacity:1;transition:.5s;white-space:nowrap}
  #controls{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;justify-content:space-between;align-items:flex-end;z-index:12;pointer-events:none}
  #joy{width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.33);border:2px solid rgba(255,255,255,.75);position:relative;pointer-events:auto;box-shadow:inset 0 0 18px rgba(0,0,0,.08)}
  #knob{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.88);position:absolute;left:35px;top:35px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  #jump{width:92px;height:92px;border-radius:50%;border:0;background:#ffd84e;color:#4d4b3c;font-weight:1000;font-size:20px;pointer-events:auto;box-shadow:0 8px 0 #d8ad1d,0 12px 26px rgba(0,0,0,.2)}
  #jump:active{transform:translateY(5px);box-shadow:0 3px 0 #d8ad1d}
  #overlay{position:fixed;inset:0;z-index:30;background:linear-gradient(#bfefff,#e8f8ff 55%,#c9f4bf);display:flex;align-items:center;justify-content:center;padding:22px}
  .card{width:min(92vw,430px);background:rgba(255,255,255,.96);border-radius:30px;padding:24px 20px 20px;text-align:center;box-shadow:0 25px 70px rgba(62,117,150,.25)}
  .logo{font-size:30px;font-weight:1000;letter-spacing:1px;color:#4e82ad}
  .sub{font-size:19px;font-weight:900;color:#6588a1;margin:2px 0 14px}
  .hero{height:150px;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.12))}
  .desc{font-size:14px;line-height:1.7;color:#586874}
  #start{width:100%;border:0;border-radius:18px;padding:15px;background:#ffd84e;font-size:19px;font-weight:1000;color:#534e36;box-shadow:0 6px 0 #d8ad1d}
  #start:active{transform:translateY(4px);box-shadow:0 2px 0 #d8ad1d}
  #toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);z-index:20;font-weight:1000;font-size:30px;color:white;text-shadow:0 3px 0 #49708b,0 0 10px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.18s}
  #mute{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 58px);z-index:15;border:0;background:rgba(255,255,255,.88);border-radius:999px;width:42px;height:42px;font-size:19px;box-shadow:0 5px 15px rgba(0,0,0,.12)}
  #loading{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;color:#6c8292;z-index:40}
</style>
</head>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
(() => {
  const loading = document.getElementById('loading');
  loading.remove();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xaee8ff);
  scene.fog = new THREE.Fog(0xaee8ff, 45, 110);

  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 180);
  const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.prepend(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x91ba72, 2.3);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(-20, 35, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-55; sun.shadow.camera.right=55; sun.shadow.camera.top=55; sun.shadow.camera.bottom=-55;
  scene.add(sun);

  const mat = (c) => new THREE.MeshStandardMaterial({color:c,roughness:.9});
  const boxGeo = new THREE.BoxGeometry(1,1,1);

  // 地面
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120,120), mat(0xbdeca7));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

  // 道路
  const roadMat = mat(0x9aa9b2), walkMat = mat(0xe8e4d6);
  function road(x,z,w,d) {
    const r=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadMat); r.position.set(x,.03,z); r.receiveShadow=true; scene.add(r);
  }
  road(0,0,12,110); road(0,0,110,12);
  road(-30,0,8,110); road(30,0,8,110); road(0,-30,110,8); road(0,30,110,8);

  // 横断歩道
  function crosswalk(x,z,rot=0){
    for(let i=-4;i<=4;i++){
      const s=new THREE.Mesh(new THREE.BoxGeometry(1.4,.04,5.5),mat(0xf7f4e9));
      s.position.set(x+i*1.8,.09,z); s.rotation.y=rot; scene.add(s);
    }
  }
  crosswalk(0,0,0); crosswalk(-30,0,0); crosswalk(30,0,0);

  // 建物
  const colors=[0xffc9c9,0xffe6a8,0xb9ddff,0xd2c2ff,0xbce8d0,0xf8c9e6];
  function building(x,z,w,d,h,c){
    const g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)); b.position.y=h/2; b.castShadow=b.receiveShadow=true; g.add(b);
    const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,2.2,4),mat(0xffffff));
    roof.position.y=h+1; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
    // ドア
    const door=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.5,.16),mat(0x946b55));
    door.position.set(0,1.25,d/2+.09); g.add(door);
    // 窓
    for(const sx of [-1,1]){
      const win=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.25,.14),mat(0x9fe4ff));
      win.position.set(sx*w*.22,h*.57,d/2+.09); g.add(win);
    }
    g.position.set(x,0,z); scene.add(g);
  }
  const lots=[[-17,-17],[17,-17],[-17,17],[17,17],[-43,-17],[43,-17],[-43,17],[43,17],[-17,-43],[17,-43],[-17,43],[17,43],[-43,-43],[43,-43],[-43,43],[43,43]];
  lots.forEach((p,i)=>building(p[0],p[1],9+(i%3),8+((i+1)%3),7+(i%4)*1.2,colors[i%colors.length]));

  // 木
  function tree(x,z,s=1){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.5*s,2.2*s,8),mat(0x9a6b42));
    trunk.position.set(x,1.1*s,z); trunk.castShadow=true; scene.add(trunk);
    const crown=new THREE.Mesh(new THREE.SphereGeometry(1.8*s,12,10),mat(0x65bf62));
    crown.position.set(x,3.2*s,z); crown.castShadow=true; scene.add(crown);
  }
  [[-24,-24],[24,-24],[-24,24],[24,24],[-7,-18],[7,18],[-42,4],[42,-4],[-8,42],[8,-42],[-49,35],[49,-35]].forEach((p,i)=>tree(p[0],p[1],.9+(i%3)*.1));

  // 公園・噴水
  const park=new THREE.Mesh(new THREE.CylinderGeometry(10,10,.16,32),mat(0xd5f0bd));
  park.position.set(0,.08,47); scene.add(park);
  const fountainBase=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.5,.7,24),mat(0xe7eef2));
  fountainBase.position.set(0,.35,47); fountainBase.castShadow=true; scene.add(fountainBase);
  const water=new THREE.Mesh(new THREE.CylinderGeometry(2.7,2.7,.12,24),new THREE.MeshStandardMaterial({color:0x70d6ff,roughness:.25,metalness:.05}));
  water.position.set(0,.75,47); scene.add(water);



  // ポチャッコ 3Dモデル（参考画像ベース）
  const player = new THREE.Group();
  scene.add(player);

  const whiteMat = new THREE.MeshStandardMaterial({color:0xfcfcfa, roughness:.86});
  const blackMat = new THREE.MeshStandardMaterial({color:0x141414, roughness:.92});
  const redMat   = new THREE.MeshStandardMaterial({color:0xe7352f, roughness:.84});
  const darkRedMat = new THREE.MeshStandardMaterial({color:0xb82422, roughness:.88});
  const faceMat  = new THREE.MeshStandardMaterial({color:0x0d0d0d, roughness:1});

  // --- 頭：参考画像の大きな丸顔 ---
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.13, 32, 24), whiteMat);
  head.scale.set(1.06, .92, .88);
  head.position.y = 2.58;
  head.castShadow = true;
  player.add(head);

  // --- 耳：横方向に広がる、短く太い黒耳 ---
  function makeEar(side){
    const g = new THREE.Group();
    const e = new THREE.Mesh(new THREE.CapsuleGeometry(.22, .72, 8, 16), blackMat);
    e.scale.set(1.0,1.0,.72);
    e.rotation.z = side * 1.18;
    e.rotation.x = -.12;
    e.position.x = side * .23;
    e.castShadow = true;
    g.add(e);

    // 根元を少し太く
    const root = new THREE.Mesh(new THREE.SphereGeometry(.25,14,12), blackMat);
    root.scale.set(1.15,.9,.75);
    root.position.x = -side*.12;
    g.add(root);
    return g;
  }
  const earL = makeEar(-1);
  earL.position.set(-.78,3.16,.00);
  player.add(earL);
  const earR = makeEar(1);
  earR.position.set(.78,3.16,.00);
  player.add(earR);

  // --- 頭頂部の黒い毛 ---
  const tuftGeo = new THREE.CapsuleGeometry(.055,.26,6,10);
  [-.14,0,.14].forEach((x,i)=>{
    const t = new THREE.Mesh(tuftGeo,blackMat);
    t.position.set(x,3.50,.13);
    t.rotation.z = (i-1)*.42;
    t.rotation.x = -.10;
    player.add(t);
  });

  // --- 顔：目は縦長、鼻は中央に丸く ---
  const eyeGeo = new THREE.SphereGeometry(.085, 14, 12);
  const eyeL = new THREE.Mesh(eyeGeo, faceMat);
  eyeL.scale.set(.78,1.28,.7);
  eyeL.position.set(-.31,2.62,.93);
  const eyeR = eyeL.clone();
  eyeR.position.x = .31;
  player.add(eyeL,eyeR);

  // 白い口元を少し前へ
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.39, 18, 14), whiteMat);
  muzzle.scale.set(1.18,.55,.46);
  muzzle.position.set(0,2.34,.79);
  player.add(muzzle);

  const nose = new THREE.Mesh(new THREE.SphereGeometry(.105, 14, 12), faceMat);
  nose.scale.set(1.10,.82,.75);
  nose.position.set(0,2.40,.985);
  player.add(nose);

  // --- 胴体：ずんぐりした白い体 ---
  const body = new THREE.Mesh(new THREE.SphereGeometry(.90, 28, 22), whiteMat);
  body.scale.set(.96,1.02,.80);
  body.position.y = 1.25;
  body.castShadow = true;
  player.add(body);

  // --- 赤いトップス：参考画像の胸元を覆う服 ---
  const shirt = new THREE.Mesh(new THREE.SphereGeometry(.88, 28, 20), redMat);
  shirt.scale.set(1.00,.52,.84);
  shirt.position.set(0,1.68,.05);
  shirt.castShadow = true;
  player.add(shirt);

  // 下側を白く見せるための白い腹部を前面に追加
  const belly = new THREE.Mesh(new THREE.SphereGeometry(.77,24,18), whiteMat);
  belly.scale.set(.95,.48,.82);
  belly.position.set(0,1.10,.16);
  player.add(belly);

  // 襟
  const collarL = new THREE.Mesh(new THREE.ConeGeometry(.28,.62,8), darkRedMat);
  collarL.scale.set(1.0,.72,.5);
  collarL.position.set(-.22,1.94,.68);
  collarL.rotation.z = -.95;
  collarL.rotation.x = Math.PI/2;
  player.add(collarL);
  const collarR = collarL.clone();
  collarR.position.x = .22;
  collarR.rotation.z = .95;
  player.add(collarR);

  // 中央の結び目
  const knot = new THREE.Mesh(new THREE.SphereGeometry(.13,12,10), darkRedMat);
  knot.scale.set(1.15,.8,.8);
  knot.position.set(0,1.85,.79);
  player.add(knot);

  // --- 腕：体の横に短く下げる ---
  const armGeo = new THREE.CapsuleGeometry(.18,.48,8,12);
  const armL = new THREE.Mesh(armGeo, whiteMat);
  armL.position.set(-.83,1.34,.10);
  armL.rotation.z = -.12;
  armL.castShadow = true;
  player.add(armL);
  const armR = armL.clone();
  armR.position.x = .83;
  armR.rotation.z = .12;
  player.add(armR);

  // --- 脚：短く太い ---
  const legGeo = new THREE.CapsuleGeometry(.25,.38,8,12);
  const legL = new THREE.Mesh(legGeo, whiteMat);
  legL.position.set(-.34,.52,.03);
  legL.castShadow = true;
  player.add(legL);
  const legR = legL.clone();
  legR.position.x = .34;
  player.add(legR);

  // 足先
  const footGeo = new THREE.SphereGeometry(.31, 16, 12);
  const footL = new THREE.Mesh(footGeo, whiteMat);
  footL.scale.set(1.28,.56,1.55);
  footL.position.set(-.36,.19,.25);
  player.add(footL);
  const footR = footL.clone();
  footR.position.x = .36;
  player.add(footR);

  // 参考画像の下腹部中央ライン
  const seamMat = new THREE.MeshBasicMaterial({color:0x171717});
  const seam = new THREE.Mesh(new THREE.BoxGeometry(.055,.32,.035), seamMat);
  seam.position.set(0,.55,.76);
  seam.rotation.z = 0;
  player.add(seam);

  player.position.set(0,0,13);
  player.rotation.y = Math.PI;

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(.98,28),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.16,depthWrite:false})
  );
  shadow.rotation.x=-Math.PI/2;
  shadow.position.set(0,.05,13);
  scene.add(shadow);
  // バナナアイス
  const iceItems=[];
  function makeIce(x,z){
    const g=new THREE.Group();
    const cone=new THREE.Mesh(new THREE.ConeGeometry(.28,.85,10),mat(0xd89735));
    cone.position.y=.42; cone.rotation.x=Math.PI;
    const scoop=new THREE.Mesh(new THREE.SphereGeometry(.42,14,12),mat(0xffef9a));
    scoop.scale.y=1.25; scoop.position.y=1.05;
    g.add(cone,scoop); g.position.set(x,.45,z); g.userData.baseY=.45; scene.add(g); iceItems.push(g);
  }
  [[-5,8],[7,6],[-16,4],[16,-4],[-26,12],[26,-12],[-37,7],[37,-7],[-8,-18],[8,-24],[-22,-35],[22,-39],[-42,-28],[42,28],[-47,43],[47,-43],[-8,38],[8,51],[-25,49],[25,46]].forEach(p=>makeIce(...p));

  // 目印看板
  function sign(x,z,textColor=0x4c7697){
    const post=new THREE.Mesh(new THREE.BoxGeometry(.28,2.2,.28),mat(0x98694e)); post.position.set(x,1.1,z); scene.add(post);
    const board=new THREE.Mesh(new THREE.BoxGeometry(3.8,1.25,.28),mat(0xffffff)); board.position.set(x,2.35,z); board.castShadow=true; scene.add(board);
  }
  sign(-8,10); sign(8,10);

  // 入力
  let joyX=0, joyY=0, jumping=false, vy=0, onGround=true, started=false, muted=false;
  const joy=document.getElementById('joy'), knob=document.getElementById('knob');
  let joyPointer=null;
  function setJoy(e){
    const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=e.clientX-cx, dy=e.clientY-cy; const max=38, len=Math.hypot(dx,dy)||1;
    if(len>max){dx*=max/len;dy*=max/len;}
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    joyX=dx/max; joyY=dy/max;
  }
  joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e);});
  function releaseJoy(e){if(joyPointer===null||e.pointerId===joyPointer){joyPointer=null;joyX=joyY=0;knob.style.transform='translate(0,0)';}}
  joy.addEventListener('pointerup',releaseJoy); joy.addEventListener('pointercancel',releaseJoy);

  const keys={};
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump();});
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

  function jump(){
    if(onGround){vy=7.2;onGround=false;beep(520,.06,'square',.035);}
  }
  document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});

  // 音
  let audioCtx=null;
  function audio(){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq,dur,type='sine',vol=.04){
    if(muted)return;
    const a=audio(),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(a.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.stop(a.currentTime+dur);
  }
  document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊';};

  let count=0, combo=0, comboTimer=0;
  const toast=document.getElementById('toast');
  function pop(text){
    toast.textContent=text;toast.style.opacity=1;toast.style.transform='translate(-50%,-50%) scale(1.08)';
    clearTimeout(pop.t);pop.t=setTimeout(()=>{toast.style.opacity=0;toast.style.transform='translate(-50%,-50%) scale(.8)';},700);
  }

  function collectCheck(t){
    for(const item of iceItems){
      if(!item.visible)continue;
      item.rotation.y += .035;
      item.position.y=item.userData.baseY + Math.sin(t*3 + item.position.x)*.12;
      const dx=item.position.x-player.position.x,dz=item.position.z-player.position.z;
      if(dx*dx+dz*dz<2.0){
        item.visible=false; count++; combo++; comboTimer=1.4;
        document.getElementById('iceCount').textContent=count;
        beep(760+combo*35,.11,'triangle',.05);
        pop(combo>1?`${combo} COMBO!`:'GET!');
        if(count===20) setTimeout(()=>pop('🎉 ALL CLEAR! 🎉'),450);
      }
    }
  }

  // 当たり判定：建物中心付近には入れない簡易方式
  function blocked(x,z){
    for(const [bx,bz] of lots){
      if(Math.abs(x-bx)<6.4 && Math.abs(z-bz)<5.9) return true;
    }
    return Math.abs(x)>57 || Math.abs(z)>57;
  }

  const clock=new THREE.Clock();
  let walkPhase=0;
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),.033), t=performance.now()/1000;

    let x=joyX, y=joyY;
    if(keys['a']||keys['arrowleft'])x-=1;
    if(keys['d']||keys['arrowright'])x+=1;
    if(keys['w']||keys['arrowup'])y-=1;
    if(keys['s']||keys['arrowdown'])y+=1;
    const len=Math.hypot(x,y);
    if(len>1){x/=len;y/=len;}

    if(started){
      const speed=6.3;
      const nx=player.position.x+x*speed*dt;
      const nz=player.position.z+y*speed*dt;
      if(!blocked(nx,player.position.z)) player.position.x=nx;
      if(!blocked(player.position.x,nz)) player.position.z=nz;

      if(!onGround){
        vy-=18*dt; player.position.y+=vy*dt;
        if(player.position.y<=0){player.position.y=0;vy=0;onGround=true;}
      }
      if(len>.08 && onGround){
        walkPhase+=dt*11;
        player.position.y=Math.abs(Math.sin(walkPhase))*.07;
        if(Math.hypot(x,y)>.05){
          const targetRot = Math.atan2(x,y);
          let d = targetRot - player.rotation.y;
          while(d > Math.PI) d -= Math.PI*2;
          while(d < -Math.PI) d += Math.PI*2;
          player.rotation.y += d*.18;
        }
        armL.rotation.x = Math.sin(walkPhase)*.65;
        armR.rotation.x = -Math.sin(walkPhase)*.65;
        legL.rotation.x = -Math.sin(walkPhase)*.55;
        legR.rotation.x = Math.sin(walkPhase)*.55;
        earL.rotation.z = Math.sin(walkPhase*1.25)*.08;
        earR.rotation.z = -Math.sin(walkPhase*1.25)*.08;
        head.rotation.z = Math.sin(walkPhase)*.025;
      } else if(onGround) {
        player.position.y += (0-player.position.y)*.25;
        armL.rotation.x *= .75; armR.rotation.x *= .75;
        legL.rotation.x *= .75; legR.rotation.x *= .75;
        earL.rotation.z *= .7; earR.rotation.z *= .7; head.rotation.z *= .7;
      }

      shadow.position.set(player.position.x,.05,player.position.z);
      shadow.scale.setScalar(Math.max(.7,1-player.position.y*.08));

      collectCheck(t);
      if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}

      // カメラ追従（固定アイソメ気味）
      const target=new THREE.Vector3(player.position.x+7.2,player.position.y+7.6,player.position.z+10.2);
      camera.position.lerp(target,1-Math.pow(.001,dt));
      camera.lookAt(player.position.x,player.position.y+1.75,player.position.z);
    }

    renderer.render(scene,camera);
  }

  camera.position.set(8,11,24);
  camera.lookAt(player.position.x,1.7,player.position.z);
  animate();

  document.getElementById('start').onclick=()=>{
    started=true;
    document.getElementById('overlay').style.display='none';
    document.getElementById('hint').style.opacity=1;
    setTimeout(()=>document.getElementById('hint').style.opacity=0,3500);
    try{audio();beep(660,.08,'triangle',.04);setTimeout(()=>beep(880,.09,'triangle',.04),90)}catch(e){}
  };

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
