<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ポチャッコのおさんぽ大冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#c7eeff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;pointer-events:none;font-weight:800}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.08)}
.card{width:min(92vw,430px);background:rgba(255,255,255,.95);padding:24px 20px;border-radius:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.18)}
h1{font-size:27px;margin:0 0 10px} p{line-height:1.6;color:#444}
button{width:100%;border:0;border-radius:18px;background:#ffd84f;padding:15px;font-size:19px;font-weight:900;box-shadow:0 6px 0 #d5ad19}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #d5ad19}
.small{font-size:13px;color:#666;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:9px 14px;border-radius:999px;font-weight:800;opacity:0;transition:.15s;pointer-events:none}
</style>
</head>

<canvas id="game"></canvas>

</div>

<div id="overlay">

</div>

(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const toast = document.getElementById("toast");

  const idleImg = new Image(); idleImg.src = IDLE_SRC;
  const runImg = new Image(); runImg.src = RUN_SRC;
  const celebrateImg = new Image(); celebrateImg.src = CELEBRATE_SRC;

  let W=0,H=0,dpr=1,groundY=0;
  let running=false,last=0,elapsed=0,speed=285;
  let score=0;
  let best=Number(localStorage.getItem("pochacco_best_v2")||0);
  bestEl.textContent=best;

  const player={x:70,y:0,vy:0,w:88,h:82,onGround:true};
  const obstacles=[], treats=[], clouds=[];
  let obsTimer=0,treatTimer=0;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    groundY=H*.76;
    if(!running) player.y=groundY-player.h;
  }
  addEventListener("resize",resize); resize();

  function reset(){
    obstacles.length=0;treats.length=0;clouds.length=0;
    elapsed=0;score=0;speed=285;obsTimer=.8;treatTimer=.7;
    player.x=Math.max(45,W*.15);player.y=groundY-player.h;player.vy=0;player.onGround=true;
    scoreEl.textContent="0";
    for(let i=0;i<5;i++) clouds.push({x:Math.random()*W,y:65+Math.random()*H*.25,s:22+Math.random()*30,v:8+Math.random()*9});
  }

  function jump(){
    if(!running)return;
    if(player.onGround){player.vy=-610;player.onGround=false;showToast("ぴょん！");}
  }

  function showToast(msg){
    toast.textContent=msg;toast.style.opacity=1;
    clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.opacity=0,340);
  }

  function start(){
    overlay.style.display="none";reset();running=true;last=performance.now();requestAnimationFrame(loop);
  }
  var startButton = document.getElementById("startBtn");
  startButton.addEventListener("click", function(e){
    e.preventDefault();
    start();
  });
  startButton.addEventListener("touchend", function(e){
    e.preventDefault();
    start();
  }, {passive:false});
  canvas.addEventListener("click", function(e){ e.preventDefault(); jump(); });
  canvas.addEventListener("touchstart", function(e){ e.preventDefault(); jump(); }, {passive:false});
  document.body.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive:false});

  function spawnObstacle(){
    const type=Math.random()<.55?"cone":"puddle";
    if(type==="cone") obstacles.push({x:W+30,y:groundY-48,w:34,h:48,type});
    else obstacles.push({x:W+30,y:groundY-18,w:70,h:18,type});
  }
  function spawnTreat(){
    treats.push({x:W+20,y:groundY-90-Math.random()*110,r:16});
  }

  function hitRect(a,b){
    return a.x+18<b.x+b.w && a.x+a.w-16>b.x && a.y+14<b.y+b.h && a.y+a.h-8>b.y;
  }
  function hitTreat(t){
    const cx=player.x+player.w*.5, cy=player.y+player.h*.48;
    const dx=cx-t.x,dy=cy-t.y;
    return dx*dx+dy*dy<(t.r+25)*(t.r+25);
  }

  function update(dt){
    elapsed+=dt;
    speed=285+Math.min(220,elapsed*6);

    player.vy+=1500*dt;player.y+=player.vy*dt;
    if(player.y>=groundY-player.h){player.y=groundY-player.h;player.vy=0;player.onGround=true;}

    obsTimer-=dt;
    if(obsTimer<=0){spawnObstacle();obsTimer=Math.max(.8,1.4-elapsed*.01)+Math.random()*.5;}
    treatTimer-=dt;
    if(treatTimer<=0){spawnTreat();treatTimer=1.0+Math.random()*1.25;}

    clouds.forEach(c=>{c.x-=c.v*dt;if(c.x<-100)c.x=W+100});

    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];o.x-=speed*dt;
      if(hitRect(player,o)){gameOver();return;}
      if(o.x+o.w<0)obstacles.splice(i,1);
    }

    for(let i=treats.length-1;i>=0;i--){
      const t=treats[i];t.x-=speed*dt;
      if(hitTreat(t)){treats.splice(i,1);score+=10;showToast("クッキー +10 🍪");continue;}
      if(t.x+t.r<0)treats.splice(i,1);
    }

    score+=dt*2;
    scoreEl.textContent=Math.floor(score);
  }

  function gameOver(){
    running=false;
    const finalScore=Math.floor(score);
    if(finalScore>best){best=finalScore;localStorage.setItem("pochacco_best_v2",best);bestEl.textContent=best;}
    overlay.innerHTML=`
      <div class="card">
        <img src="${CELEBRATE_SRC}" style="width:120px;max-height:120px;object-fit:contain;margin-bottom:4px">
        <h1>おさんぽ終了！</h1>
        <p>今回のスコア：<b>${finalScore}</b><br>ベスト：<b>${best}</b></p>
        <button id="retryBtn">もう一度！</button>
      </div>`;
    overlay.style.display="flex";
    var retryButton=document.getElementById("retryBtn");
    retryButton.addEventListener("click",function(e){e.preventDefault();start();});
    retryButton.addEventListener("touchend",function(e){e.preventDefault();start();},{passive:false});
  }


  function roundedRect(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,groundY);
    g.addColorStop(0,"#c5edff");g.addColorStop(1,"#f4fbff");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,groundY);

    ctx.fillStyle="#ffe670";ctx.beginPath();ctx.arc(W-58,90,29,0,Math.PI*2);ctx.fill();

    for(const c of clouds){
      ctx.fillStyle="rgba(255,255,255,.92)";
      ctx.beginPath();ctx.arc(c.x,c.y,c.s*.55,0,Math.PI*2);
      ctx.arc(c.x+c.s*.5,c.y-8,c.s*.42,0,Math.PI*2);
      ctx.arc(c.x+c.s,c.y,c.s*.5,0,Math.PI*2);ctx.fill();
    }

    ctx.fillStyle="#a8de8a";ctx.fillRect(0,groundY,W,H-groundY);
    ctx.fillStyle="#77c15e";ctx.fillRect(0,groundY,W,12);

    // rolling hills
    ctx.fillStyle="#c5e9a9";
    for(let x=-60;x<W+80;x+=150){
      ctx.beginPath();ctx.arc(x,groundY+8,95,Math.PI,0);ctx.fill();
    }
  }

  function drawTreat(t){
    ctx.save();ctx.translate(t.x,t.y);
    ctx.fillStyle="#c98643";ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#704119";
    [[-5,-5],[6,-6],[3,5],[-7,7]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.3,0,Math.PI*2);ctx.fill()});
    ctx.restore();
  }

  function drawObstacle(o){
    if(o.type==="cone"){
      ctx.fillStyle="#ff8c3c";ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.lineTo(o.x,o.y+o.h);ctx.closePath();ctx.fill();
      ctx.fillStyle="#fff";ctx.fillRect(o.x+5,o.y+o.h*.6,o.w-10,6);
    } else {
      ctx.fillStyle="#70b8e8";ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(o.x+25,o.y+6,18,3,0,0,Math.PI*2);ctx.fill();
    }
  }

  function drawPlayer(){
    const img = player.onGround ? runImg : idleImg;
    ctx.save();

    // soft shadow
    ctx.fillStyle="rgba(0,0,0,.12)";
    ctx.beginPath();ctx.ellipse(player.x+player.w/2,groundY+3,34,7,0,0,Math.PI*2);ctx.fill();

    const bob = player.onGround ? Math.sin(elapsed*12)*2 : 0;
    const tilt = player.onGround ? Math.sin(elapsed*10)*0.025 : -0.08;

    ctx.translate(player.x+player.w/2,player.y+player.h/2+bob);
    ctx.rotate(tilt);
    ctx.drawImage(img,-player.w/2,-player.h/2,player.w,player.h);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    treats.forEach(drawTreat);
    obstacles.forEach(drawObstacle);
    drawPlayer();

    // flowers
    for(let x=25;x<W;x+=105){
      const y=groundY+55+(x%50);
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.arc(x+7,y+1,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#ffd84f";ctx.beginPath();ctx.arc(x+3,y+1,3,0,Math.PI*2);ctx.fill();
    }
  }

  function loop(t){
    if(!running)return;
    const dt=Math.min(.033,(t-last)/1000||0);last=t;
    update(dt);draw();
    if(running)requestAnimationFrame(loop);
  }

  // initial preview
  reset();draw();
})();
</script>
</body>
</html>
